name: CHM13 nonoracle structured optimizer
on:
  push:
    branches: [benchmark/qubo-solvers-20260922]
    paths:
      - "olc_overlap_framework/benchmark_chm13_nonoracle_structured_optimizer.py"
      - ".github/workflows/chm13-nonoracle-structured-optimizer.yml"
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install -e ./olc_overlap_framework
          python -m pip install "networkx>=3.2" "dimod==0.12.22" "dwave-samplers==1.8.0" "z3-solver>=4.12"
      - name: Run
        working-directory: olc_overlap_framework
        run: python benchmark_chm13_nonoracle_structured_optimizer.py
      - uses: actions/upload-artifact@v4
        with:
          name: chm13-nonoracle-structured-optimizer
          path: olc_overlap_framework/debug/qubo/chm13_nonoracle_structured_optimizer_20260928.json
