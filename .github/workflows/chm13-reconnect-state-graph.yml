name: CHM13 reconnect state graph audit
on:
  push:
    branches: [benchmark/qubo-solvers-20260922]
    paths:
      - "olc_overlap_framework/benchmark_chm13_reconnect_state_graph.py"
      - ".github/workflows/chm13-reconnect-state-graph.yml"
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Install
        run: |
          python -m pip install -e ./olc_overlap_framework
          python -m pip install "networkx>=3.2" "z3-solver>=4.12" "dimod==0.12.22" "dwave-samplers==1.8.0"
      - name: Run
        working-directory: olc_overlap_framework
        run: python benchmark_chm13_reconnect_state_graph.py
      - uses: actions/upload-artifact@v4
        with:
          name: chm13-reconnect-state-graph
          path: olc_overlap_framework/debug/qubo/chm13_reconnect_state_graph_20260928.json
