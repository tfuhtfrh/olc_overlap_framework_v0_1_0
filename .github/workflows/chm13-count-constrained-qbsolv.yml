name: CHM13 count-constrained comparator QBSolv
on:
  push:
    branches: [benchmark/qubo-solvers-20260922]
    paths:
      - "olc_overlap_framework/benchmark_chm13_count_constrained_qbsolv.py"
      - ".github/workflows/chm13-count-constrained-qbsolv.yml"
  workflow_dispatch:
jobs:
  qbsolv:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install
        run: |
          python -m pip install --upgrade "pip<25"
          python -m pip install -e ./olc_overlap_framework
          python -m pip install "dwave-qbsolv==0.3.4"
      - name: Run
        working-directory: olc_overlap_framework
        run: python benchmark_chm13_count_constrained_qbsolv.py
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: chm13-count-constrained-qbsolv
          path: olc_overlap_framework/debug/qubo/chm13_count_constrained_qbsolv_20260926.json
          if-no-files-found: error
