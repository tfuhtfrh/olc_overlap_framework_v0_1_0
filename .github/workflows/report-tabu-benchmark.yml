name: Stage report Tabu comparison

on:
  push:
    branches: [benchmark/qubo-solvers-20260922]
    paths:
      - olc_overlap_framework/report_tabu_benchmark.py
      - .github/workflows/report-tabu-benchmark.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install using previous experiment environment recipe
        run: |
          python -m pip install -e ./olc_overlap_framework
          python -m pip install "networkx>=3.2" "dimod==0.12.22" "dwave-samplers==1.8.0" "openjij>=0.9" "z3-solver>=4.12"
          mkdir -p environment
          python -m pip freeze --exclude-editable > environment/requirements-lock.txt
          python -m pip list --format=json > environment/packages.json
          python --version > environment/python.txt
          uname -a > environment/runner.txt
      - name: Audit and smoke test Tabu with fixed cycle penalty
        working-directory: olc_overlap_framework
        run: python report_tabu_benchmark.py preflight --out ../tabu-preflight
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tabu-environment
          path: environment/
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tabu-preflight
          path: tabu-preflight/
          retention-days: 90

  formal:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        method: [rank, edge]
        seed_index: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: tabu-environment
          path: environment
      - uses: actions/download-artifact@v4
        with:
          name: tabu-preflight
          path: tabu-preflight
      - name: Install frozen shared dependency versions
        run: |
          python -m pip install -r environment/requirements-lock.txt
          python -m pip install --no-deps -e ./olc_overlap_framework
      - name: Run fixed-budget independent trial
        working-directory: olc_overlap_framework
        run: >-
          python report_tabu_benchmark.py run
          --method ${{ matrix.method }}
          --seed-index ${{ matrix.seed_index }}
          --config ../tabu-preflight/selected_config.json
          --out ../tabu-formal/${{ matrix.method }}-${{ matrix.seed_index }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tabu-formal-${{ matrix.method }}-${{ matrix.seed_index }}
          path: tabu-formal/
          retention-days: 90

  aggregate:
    needs: [prepare, formal]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: tabu-environment
          path: environment
      - uses: actions/download-artifact@v4
        with:
          pattern: tabu-formal-*
          path: tabu-trials
          merge-multiple: true
      - name: Install frozen shared dependency versions
        run: |
          python -m pip install -r environment/requirements-lock.txt
          python -m pip install --no-deps -e ./olc_overlap_framework
      - name: Aggregate all twelve independent trials
        working-directory: olc_overlap_framework
        run: python report_tabu_benchmark.py aggregate --input ../tabu-trials --out ../tabu-results/comparison.json
      - name: Publish job summary
        run: |
          echo '## Stage report Tabu comparison' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat tabu-results/comparison.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: tabu-results
          path: tabu-results/
          retention-days: 90
