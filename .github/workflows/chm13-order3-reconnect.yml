name: CHM13 order-3 reconnect diagnostic
on:
  push:
    branches: [benchmark/qubo-solvers-20260922]
    paths:
      - "olc_overlap_framework/diagnose_chm13_order3_reconnect.py"
      - ".github/workflows/chm13-order3-reconnect.yml"
  workflow_dispatch:
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Install
        run: |
          python -m pip install -e ./olc_overlap_framework
          python -m pip install "dimod==0.12.22" "networkx>=3.2" "dwave-samplers==1.8.0"
      - name: Run
        working-directory: olc_overlap_framework
        run: python diagnose_chm13_order3_reconnect.py
      - uses: actions/upload-artifact@v4
        with:
          name: chm13-order3-reconnect
          path: olc_overlap_framework/debug/qubo/chm13_reconnect_order3_diagnostic_20260928.json
