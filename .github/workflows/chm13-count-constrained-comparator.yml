name: CHM13 count-constrained comparator audit
on:
  push:
    branches: [benchmark/qubo-solvers-20260922]
    paths:
      - "olc_overlap_framework/experimental_chm13_count_constrained_comparator_qubo.py"
      - ".github/workflows/chm13-count-constrained-comparator.yml"
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e ./olc_overlap_framework
      - name: Audit
        working-directory: olc_overlap_framework
        run: python experimental_chm13_count_constrained_comparator_qubo.py
