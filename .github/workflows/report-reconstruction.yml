name: Reconstruct SQA layout versus optimal path
on:
  push:
    branches: [benchmark/qubo-solvers-20260922]
    paths:
      - olc_overlap_framework/evaluate_report_reconstruction.py
      - .github/workflows/report-reconstruction.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: accum-formal-sqa-3
          path: saved-trial
          run-id: 39141763797
          github-token: ${{ github.token }}
      - name: Install alignment tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y minimap2
          python -m pip install edlib==1.3.9.post1
      - name: Reconstruct both paths and compare with reference
        run: >-
          python olc_overlap_framework/evaluate_report_reconstruction.py
          --dataset test_data/CHM13/CHM13_complex144
          --trials saved-trial
          --out reconstruction-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reconstruction-results
          path: reconstruction-results/
          retention-days: 90
