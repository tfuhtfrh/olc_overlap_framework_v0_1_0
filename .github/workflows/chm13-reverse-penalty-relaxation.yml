name: CHM13 reverse penalty relaxation
on:
  push:
    branches: [benchmark/qubo-solvers-20260922]
    paths:
      - "olc_overlap_framework/benchmark_chm13_reverse_penalty_relaxation.py"
      - ".github/workflows/chm13-reverse-penalty-relaxation.yml"
  workflow_dispatch:
jobs:
  run:
    strategy:
      fail-fast: false
      matrix:
        lambda: ["1.0","0.5","0.25","0.10","0.05","0.02","0.01"]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install -e ./olc_overlap_framework
          python -m pip install "networkx>=3.2" "dimod==0.12.22" "dwave-samplers==1.8.0" "openjij>=0.9"
      - name: Run
        working-directory: olc_overlap_framework
        env:
          LAMBDA: ${{ matrix.lambda }}
        run: python benchmark_chm13_reverse_penalty_relaxation.py
      - uses: actions/upload-artifact@v4
        with:
          name: reverse-penalty-${{ matrix.lambda }}
          path: olc_overlap_framework/debug/qubo/chm13_reverse_penalty_lambda_${{ matrix.lambda }}_20260930.json
