name: CHM13 projected edge SQA extended
on:
  push:
    branches: [benchmark/qubo-solvers-20260922]
    paths:
      - "olc_overlap_framework/benchmark_chm13_projected_edge_sqa_extended.py"
      - ".github/workflows/chm13-projected-edge-sqa-extended.yml"
  workflow_dispatch:
jobs:
  sqa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install -e ./olc_overlap_framework
          python -m pip install "openjij>=0.9" "dwave-samplers==1.8.0" "dimod==0.12.22" "networkx>=3.2"
      - name: Run extended projected SQA
        working-directory: olc_overlap_framework
        run: python benchmark_chm13_projected_edge_sqa_extended.py
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: chm13-projected-edge-sqa-extended
          path: olc_overlap_framework/debug/qubo/chm13_projected_edge_sqa_extended_20260926.json
          if-no-files-found: error
