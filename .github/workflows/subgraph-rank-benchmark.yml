name: Order-variable QUBO on complex144 subgraphs (SQA vs QbSolv)

on:
  push:
    branches: [claude/qubo-main]
    paths:
      - olc_overlap_framework/subgraph_rank_benchmark.py
      - .github/workflows/subgraph-rank-benchmark.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"

jobs:
  sqa:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        n: [12, 24, 36, 48, 72, 96]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (stage-report SQA recipe, OpenJij pinned to the report version)
        run: |
          python -m pip install -e ./olc_overlap_framework
          python -m pip install "networkx>=3.2" "dimod==0.12.22" "dwave-samplers==1.8.0" "openjij==0.12.2" "z3-solver>=4.12"
      - name: Run SQA
        working-directory: olc_overlap_framework
        run: python subgraph_rank_benchmark.py --n ${{ matrix.n }} --solver sqa --out ../subgraph-out
      - name: Commit summary
        run: |
          DEST=olc_overlap_framework/debug/qubo/subgraph_rank/run_${{ github.run_id }}
          mkdir -p $DEST
          cp subgraph-out/summary_*.json $DEST/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $DEST
          git commit -m "Add subgraph rank summary (run ${{ github.run_id }}, ${{ github.job }} n=${{ matrix.n }})"
          git stash -u -q || true
          for i in 1 2 3 4 5 6; do git pull --rebase -q origin ${{ github.ref_name }} && git push -q origin HEAD:${{ github.ref_name }} && break; sleep $((RANDOM % 10 + 5)); done

  qbsolv:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        n: [12, 24, 36, 48, 72, 96]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install
        run: |
          python -m pip install --upgrade "pip<25"
          python -m pip install -e ./olc_overlap_framework
          python -m pip install "dwave-qbsolv==0.3.4"
      - name: Run QbSolv
        working-directory: olc_overlap_framework
        run: python subgraph_rank_benchmark.py --n ${{ matrix.n }} --solver qbsolv --out ../subgraph-out
      - name: Commit summary
        run: |
          DEST=olc_overlap_framework/debug/qubo/subgraph_rank/run_${{ github.run_id }}
          mkdir -p $DEST
          cp subgraph-out/summary_*.json $DEST/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $DEST
          git commit -m "Add subgraph rank summary (run ${{ github.run_id }}, ${{ github.job }} n=${{ matrix.n }})"
          git stash -u -q || true
          for i in 1 2 3 4 5 6; do git pull --rebase -q origin ${{ github.ref_name }} && git push -q origin HEAD:${{ github.ref_name }} && break; sleep $((RANDOM % 10 + 5)); done
