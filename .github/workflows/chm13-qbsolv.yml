name: CHM13 QBSolv comparison
on:
  push:
    branches: [benchmark/qubo-solvers-20260922]
    paths:
      - "olc_overlap_framework/benchmark_chm13_qbsolv.py"
      - ".github/workflows/chm13-qbsolv.yml"
  workflow_dispatch:
jobs:
  qbsolv:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install project and archived QBSolv
        run: |
          python -m pip install --upgrade "pip<25"
          python -m pip install -e ./olc_overlap_framework
          python -m pip install "dwave-qbsolv==0.3.4"
      - name: Run QBSolv comparison
        working-directory: olc_overlap_framework
        run: python benchmark_chm13_qbsolv.py
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: chm13-qbsolv-comparison
          path: olc_overlap_framework/debug/qubo/chm13_qbsolv_comparison_20260925.json
          if-no-files-found: error
