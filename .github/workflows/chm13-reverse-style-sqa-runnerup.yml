name: CHM13 reverse-style SQA runner-up
on:
  push:
    branches: [benchmark/qubo-solvers-20260922]
    paths:
      - "olc_overlap_framework/benchmark_chm13_reverse_style_sqa_runnerup.py"
      - "olc_overlap_framework/benchmark_chm13_reverse_style_sqa_worker.py"
      - ".github/workflows/chm13-reverse-style-sqa-runnerup.yml"
  workflow_dispatch:
jobs:
  run:
    strategy:
      fail-fast: false
      matrix:
        config:
          [forward_default, rev_090_p50, rev_080_p50, rev_070_p50, rev_060_p50,
           rev_050_p50, rev_040_p50, rev_080_p25, rev_060_p25, rev_040_p25]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install -e ./olc_overlap_framework
          python -m pip install "networkx>=3.2" "dimod==0.12.22" "dwave-samplers==1.8.0" "openjij>=0.9"
      - name: Run
        working-directory: olc_overlap_framework
        env:
          CONFIG: ${{ matrix.config }}
        run: python benchmark_chm13_reverse_style_sqa_worker.py
      - uses: actions/upload-artifact@v4
        with:
          name: reverse-style-${{ matrix.config }}
          path: olc_overlap_framework/debug/qubo/chm13_reverse_style_worker_${{ matrix.config }}_20260930.json
