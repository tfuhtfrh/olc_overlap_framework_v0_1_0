name: CHM13 latent rank dwave-hybrid
on:
  push:
    branches: [benchmark/qubo-solvers-20260922]
    paths:
      - "olc_overlap_framework/benchmark_chm13_latent_rank_dwave_hybrid.py"
      - ".github/workflows/chm13-latent-rank-dwave-hybrid.yml"
  workflow_dispatch:
jobs:
  hybrid:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install -e ./olc_overlap_framework
          python -m pip install "dwave-hybrid>=0.6.14"
      - name: Run
        working-directory: olc_overlap_framework
        run: python benchmark_chm13_latent_rank_dwave_hybrid.py
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: chm13-latent-rank-dwave-hybrid
          path: olc_overlap_framework/debug/qubo/chm13_latent_rank_dwave_hybrid_20260926.json
          if-no-files-found: error
