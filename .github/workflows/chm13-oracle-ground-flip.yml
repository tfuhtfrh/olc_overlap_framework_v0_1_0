name: CHM13 oracle ground flip path
on:
  push:
    branches: [benchmark/qubo-solvers-20260922]
    paths:
      - "olc_overlap_framework/diagnose_chm13_oracle_ground_flip_path.py"
      - ".github/workflows/chm13-oracle-ground-flip.yml"
  workflow_dispatch:
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install -e ./olc_overlap_framework
          python -m pip install "networkx>=3.2" "dimod==0.12.22" "dwave-samplers==1.8.0" "z3-solver>=4.12"
      - name: Run
        working-directory: olc_overlap_framework
        run: python diagnose_chm13_oracle_ground_flip_path.py
      - uses: actions/upload-artifact@v4
        with:
          name: chm13-oracle-ground-flip
          path: olc_overlap_framework/debug/qubo/chm13_oracle_ground_flip_path_20260928.json
