name: CHM13 source-sink basin diagnostic
on:
  push:
    branches: [benchmark/qubo-solvers-20260922]
    paths:
      - "olc_overlap_framework/debug_source_sink_projected_basin.py"
      - ".github/workflows/chm13-source-sink-basin.yml"
  workflow_dispatch:
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install -e ./olc_overlap_framework
          python -m pip install "dwave-samplers==1.8.0" "dimod==0.12.22" "networkx>=3.2"
      - name: Run
        working-directory: olc_overlap_framework
        run: python debug_source_sink_projected_basin.py
