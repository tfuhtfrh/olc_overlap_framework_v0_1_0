name: CHM13 pure-selection order audit
on:
  push:
    branches: [benchmark/qubo-solvers-20260922]
    paths:
      - "olc_overlap_framework/experimental_chm13_pure_selection_order_qubo.py"
      - ".github/workflows/chm13-pure-selection-order.yml"
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install -e ./olc_overlap_framework
      - name: Audit reference
        working-directory: olc_overlap_framework
        run: python experimental_chm13_pure_selection_order_qubo.py
