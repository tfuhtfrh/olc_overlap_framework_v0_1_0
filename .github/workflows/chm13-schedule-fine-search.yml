name: CHM13 schedule fine search
on:
  push:
    branches: [benchmark/qubo-solvers-20260922]
    paths:
      - "olc_overlap_framework/benchmark_chm13_schedule_fine_search.py"
      - ".github/workflows/chm13-schedule-fine-search.yml"
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install -e ./olc_overlap_framework
          python -m pip install "networkx>=3.2" "dimod==0.12.22" "dwave-samplers==1.8.0"
      - name: Run
        working-directory: olc_overlap_framework
        run: python benchmark_chm13_schedule_fine_search.py
      - uses: actions/upload-artifact@v4
        with:
          name: chm13-schedule-fine-search
          path: olc_overlap_framework/debug/qubo/chm13_schedule_fine_search_20260930.json
