name: CHM13 deep reverse-like SQA
on:
  push:
    branches: [benchmark/qubo-solvers-20260922]
    paths:
      - "olc_overlap_framework/benchmark_chm13_reverse_like_deep_worker.py"
      - ".github/workflows/chm13-reverse-like-deep.yml"
  workflow_dispatch:
jobs:
  run:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {label: s025, smin: "0.25"}
          - {label: s020, smin: "0.20"}
          - {label: s015, smin: "0.15"}
          - {label: s010, smin: "0.10"}
          - {label: s005, smin: "0.05"}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install -e ./olc_overlap_framework
          python -m pip install "networkx>=3.2" "dimod==0.12.22" "dwave-samplers==1.8.0" "openjij>=0.9"
      - name: Run
        working-directory: olc_overlap_framework
        env:
          LABEL: ${{ matrix.label }}
          SMIN: ${{ matrix.smin }}
        run: python benchmark_chm13_reverse_like_deep_worker.py
      - uses: actions/upload-artifact@v4
        with:
          name: reverse-like-deep-${{ matrix.label }}
          path: olc_overlap_framework/debug/qubo/chm13_reverse_like_deep_${{ matrix.label }}_20260930.json
