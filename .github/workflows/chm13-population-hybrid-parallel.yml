name: CHM13 population hybrid parallel
on:
  push:
    branches: [benchmark/qubo-solvers-20260922]
    paths:
      - "olc_overlap_framework/benchmark_chm13_population_worker.py"
      - ".github/workflows/chm13-population-hybrid-parallel.yml"
  workflow_dispatch:
jobs:
  run:
    strategy:
      fail-fast: false
      matrix:
        method: [single8, beam2_energy, beam2_diverse, beam2_combo]
        start: [zero, random]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install -e ./olc_overlap_framework
          python -m pip install "networkx>=3.2" "dimod==0.12.22" "dwave-samplers==1.8.0" "openjij>=0.9"
      - name: Run
        working-directory: olc_overlap_framework
        env:
          METHOD: ${{ matrix.method }}
          START: ${{ matrix.start }}
        run: python benchmark_chm13_population_worker.py
      - uses: actions/upload-artifact@v4
        with:
          name: population-${{ matrix.method }}-${{ matrix.start }}
          path: olc_overlap_framework/debug/qubo/chm13_population_worker_${{ matrix.method }}_${{ matrix.start }}_20260930.json
