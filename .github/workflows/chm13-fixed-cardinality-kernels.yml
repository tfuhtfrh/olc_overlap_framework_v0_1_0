name: CHM13 fixed-cardinality kernel benchmark
on:
  push:
    branches: [benchmark/qubo-solvers-20260922]
    paths:
      - "olc_overlap_framework/benchmark_chm13_fixed_cardinality_kernels.py"
      - ".github/workflows/chm13-fixed-cardinality-kernels.yml"
  workflow_dispatch:
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install -e ./olc_overlap_framework
          python -m pip install "dimod==0.12.22" "networkx>=3.2" "dwave-samplers==1.8.0"
      - name: Run benchmark
        working-directory: olc_overlap_framework
        run: python benchmark_chm13_fixed_cardinality_kernels.py
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: chm13-fixed-cardinality-kernels
          path: olc_overlap_framework/debug/qubo/chm13_fixed_cardinality_kernel_benchmark_20260928.json
          if-no-files-found: error
