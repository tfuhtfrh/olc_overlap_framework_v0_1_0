name: CHM13 Tabu quick validation

on:
  push:
    branches:
      - benchmark/qubo-solvers-20260922
    paths:
      - ".github/workflows/chm13-tabu-quick.yml"
  workflow_dispatch:

jobs:
  quick:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install -e ./olc_overlap_framework
          python -m pip install "dwave-samplers==1.8.0" "dimod==0.12.22"
      - name: Run quick production Tabu comparison
        working-directory: olc_overlap_framework
        run: |
          python benchmark_chm13_tabu_two_hamiltonians.py \
            --output debug/qubo/chm13_tabu_quick_20260925.json \
            --short-timeout-ms 2000 --short-reads 1 \
            --long-timeout-ms 5000 --long-reads 1
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: chm13-tabu-quick
          path: olc_overlap_framework/debug/qubo/chm13_tabu_quick_20260925.json
          if-no-files-found: error
