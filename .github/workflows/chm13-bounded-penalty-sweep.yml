name: CHM13 bounded penalty sweep

on:
  push:
    branches:
      - benchmark/qubo-solvers-20260922
    paths:
      - "olc_overlap_framework/benchmark_chm13_bounded_penalty_sweep.py"
      - ".github/workflows/chm13-bounded-penalty-sweep.yml"
  workflow_dispatch:

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install -e ./olc_overlap_framework
          python -m pip install "dwave-samplers==1.8.0" "dimod==0.12.22"
      - name: Run sweep
        working-directory: olc_overlap_framework
        run: python benchmark_chm13_bounded_penalty_sweep.py
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: chm13-bounded-penalty-sweep
          path: olc_overlap_framework/debug/qubo/chm13_bounded_penalty_sweep_20260925.json
          if-no-files-found: error
