name: CHM13 QUBO solver benchmark

on:
  push:
    branches:
      - benchmark/qubo-solvers-20260922
    paths:
      - "olc_overlap_framework/benchmark_chm13_tabu_two_hamiltonians.py"
      - "olc_overlap_framework/experimental_chm13_vertex_carry_qubo.py"
      - ".github/workflows/chm13-qubo-solvers.yml"
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project and production Tabu sampler
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./olc_overlap_framework
          python -m pip install "dwave-samplers==1.8.0" "dimod==0.12.22"

      - name: Run production Tabu comparison
        working-directory: olc_overlap_framework
        run: |
          python benchmark_chm13_tabu_two_hamiltonians.py \
            --output debug/qubo/chm13_tabu_production_20260925.json \
            --short-timeout-ms 5000 --short-reads 4 \
            --long-timeout-ms 20000 --long-reads 4

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: chm13-production-tabu-two-hamiltonians
          path: olc_overlap_framework/debug/qubo/chm13_tabu_production_20260925.json
          if-no-files-found: error
