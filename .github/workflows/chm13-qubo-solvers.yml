name: CHM13 QUBO solver benchmark

on:
  push:
    branches:
      - benchmark/qubo-solvers-20260922
    paths:
      - "olc_overlap_framework/benchmark_chm13_qubo_solvers.py"
      - ".github/workflows/chm13-qubo-solvers.yml"
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project and solver backends
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./olc_overlap_framework
          python -m pip install "dwave-samplers>=1.7" "dimod>=0.12" "simulated-bifurcation>=1.3"

      - name: Run CHM13 solver benchmark
        working-directory: olc_overlap_framework
        run: |
          python benchmark_chm13_qubo_solvers.py \
            --output-dir debug/qubo/chm13_solver_benchmark_20260922 \
            --sa-reads 16 --sa-sweeps 5000 \
            --tabu-reads 8 --tabu-timeout-ms 5000 \
            --sb-agents 4 --sb-steps 400

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: chm13-qubo-solver-benchmark
          path: olc_overlap_framework/debug/qubo/chm13_solver_benchmark_20260922/
          if-no-files-found: error
