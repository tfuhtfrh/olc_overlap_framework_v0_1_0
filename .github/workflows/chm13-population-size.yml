name: CHM13 population size ablation
on:
  push:
    branches: [benchmark/qubo-solvers-20260922]
    paths:
      - "olc_overlap_framework/benchmark_chm13_population_size.py"
      - ".github/workflows/chm13-population-size.yml"
  workflow_dispatch:
jobs:
  run:
    strategy:
      fail-fast: false
      matrix:
        K: ["1","2","4"]
        start: [zero, random]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install -e ./olc_overlap_framework
          python -m pip install "networkx>=3.2" "dimod==0.12.22" "dwave-samplers==1.8.0" "openjij>=0.9"
      - name: Run
        working-directory: olc_overlap_framework
        env:
          K: ${{ matrix.K }}
          START: ${{ matrix.start }}
        run: python benchmark_chm13_population_size.py
      - uses: actions/upload-artifact@v4
        with:
          name: population-size-K${{ matrix.K }}-${{ matrix.start }}
          path: olc_overlap_framework/debug/qubo/chm13_population_size_K${{ matrix.K }}_${{ matrix.start }}_20260930.json
