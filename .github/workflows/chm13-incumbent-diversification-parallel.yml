name: CHM13 incumbent diversification parallel
on:
  push:
    branches: [benchmark/qubo-solvers-20260922]
    paths:
      - "olc_overlap_framework/benchmark_chm13_incumbent_diversification_worker.py"
      - ".github/workflows/chm13-incumbent-diversification-parallel.yml"
  workflow_dispatch:
jobs:
  run:
    strategy:
      fail-fast: false
      matrix:
        config:
          - none
          - uniform_002
          - uniform_005
          - uniform_010
          - uniform_020
          - uniform_050
          - lowreward_010
          - lowreward_020
          - lowreward_050
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install -e ./olc_overlap_framework
          python -m pip install "networkx>=3.2" "dimod==0.12.22" "dwave-samplers==1.8.0" "openjij>=0.9"
      - name: Run
        working-directory: olc_overlap_framework
        env:
          CONFIG: ${{ matrix.config }}
        run: python benchmark_chm13_incumbent_diversification_worker.py
      - uses: actions/upload-artifact@v4
        with:
          name: incumbent-diversification-${{ matrix.config }}
          path: olc_overlap_framework/debug/qubo/chm13_incumbent_diversification_${{ matrix.config }}_20260930.json
