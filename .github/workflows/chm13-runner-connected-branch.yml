name: CHM13 runner-connected branch
on:
  push:
    branches: [benchmark/qubo-solvers-20260922]
    paths:
      - "olc_overlap_framework/diagnose_chm13_runnerup_connected_branch.py"
      - ".github/workflows/chm13-runner-connected-branch.yml"
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install -e ./olc_overlap_framework
          python -m pip install "networkx>=3.2" "dimod==0.12.22" "dwave-samplers==1.8.0" "numpy>=1.26"
      - name: Run
        working-directory: olc_overlap_framework
        run: python diagnose_chm13_runnerup_connected_branch.py
      - uses: actions/upload-artifact@v4
        with:
          name: chm13-runner-connected-branch
          path: olc_overlap_framework/debug/qubo/chm13_runnerup_connected_branch_20260930.json
